<!-- 14. Golden Stealth Shuriken: Aerodynamic, surgical precision, metallic speed -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="56" fill="#090A0F"/>
  <g transform="translate(128, 128)">
    <!-- 4-Bladed Curved Aerodynamic Shuriken in Gold/Titanium -->
    <!-- Blade 1: Top -->
    <path d="M 0,-88 C 24,-60 28,-28 0,0 C -12,-32 -2,-66 0,-88 Z" fill="#FBBF24"/>
    <path d="M 0,-88 C 12,-66 2,-32 0,0 C -28,-28 -24,-60 0,-88 Z" fill="#D97706"/>

    <!-- Blade 2: Right -->
    <path d="M 88,0 C 60,24 28,28 0,0 C 32,-12 66,-2 88,0 Z" fill="#F59E0B"/>
    <path d="M 88,0 C 66,12 32,2 0,0 C 28,-28 60,-24 88,0 Z" fill="#B45309"/>

    <!-- Blade 3: Bottom -->
    <path d="M 0,88 C -24,60 -28,28 0,0 C 12,32 2,66 0,88 Z" fill="#FBBF24"/>
    <path d="M 0,88 C -12,66 -2,32 0,0 C 28,28 24,60 0,88 Z" fill="#D97706"/>

    <!-- Blade 4: Left -->
    <path d="M -88,0 C -60,-24 -28,-28 0,0 C -32,12 -66,2 -88,0 Z" fill="#F59E0B"/>
    <path d="M -88,0 C -66,-12 -32,-2 0,0 C -28,28 -60,24 -88,0 Z" fill="#B45309"/>

    <!-- Hollow Center Aperture Ring -->
