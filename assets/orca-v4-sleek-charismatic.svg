<!-- Orca Refinement 3: The Sleek & Charismatic Star-Orca (Curved, cute & friendly yet professional, like Firefox & Docker) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Obsidian Background -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <defs>
    <!-- Deep Navy to Midnight Gradient -->
    <linearGradient id="orcaCuteNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Navy Circular Boundary Ring -->
    <circle cx="0" cy="0" r="184" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="166" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Central Polaris Star from Concept 21 -->
    <polygon points="0,-40 10,-12 38,0 10,12 0,40 -10,12 -38,0 -10,-12" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4.5" fill="#172554"/>

    <!-- Beautiful Curved Orca (Leaping upwards towards the star) -->
    <!-- Dorsal Fin (Graceful backward curve) -->
    <path d="M -30,-105 C -20,-165 5,-175 25,-145 C 15,-125 5,-115 -10,-100 Z" 
          fill="#172554" stroke="#1E3A8A" stroke-width="2"/>

    <!-- Smooth Upper Back & Head Silhouette -->
    <path d="M -115,100
             C -140,50 -140,-20 -105,-80
             C -65,-140 25,-155 95,-120
             C 145,-95 165,-45 155,10
             C 145,55 115,75 80,70
             C 60,68 50,50 65,35
             C 95,5 95,-45 65,-80
             C 30,-115 -45,-105 -75,-65
             C -100,-30 -95,30 -75,70
             C -65,90 -85,115 -115,100 Z"
          fill="url(#orcaCuteNavy)" stroke="#1E40AF" stroke-width="3"/>

    <!-- Rounded Pectoral Flipper -->
    <path d="M 80,-10 C 120,5 135,35 115,55 C 95,58 75,30 70,5 Z" fill="#0F172A" stroke="#1E3A8A" stroke-width="2"/>

    <!-- Tail Fluke with smooth curved notch -->
    <path d="M -115,100 
             C -130,120 -160,140 -175,130 
             C -165,110 -138,102 -122,96
             C -135,90 -160,78 -165,60
             C -145,62 -125,80 -115,100 Z" 
          fill="#1E3A8A" stroke="#1E40AF" stroke-width="2"/>

    <!-- Pure White Belly & Jaw Silhouette -->
    <path d="M 152,0
             C 158,-30 138,-65 105,-90
             C 85,-65 95,-35 118,-5
             C 125,12 120,38 100,55
             C 80,68 62,65 52,50
             C 72,70 105,75 130,50
             C 146,32 150,15 152,0 Z" 
          fill="#FFFFFF"/>

    <!-- Characteristic White Eye Patch (Smooth rounded droplet) -->
    <path d="M 112,-65 C 135,-55 138,-38 122,-45 C 105,-52 100,-60 112,-65 Z" fill="#FFFFFF"/>

    <!-- Friendly, Intelligent Eye -->
    <circle cx="138" cy="-30" r="5" fill="#080A10"/>
    <circle cx="140" cy="-32" r="2" fill="#FFFFFF"/>

    <!-- Subtle Smile on the Snout -->
    <path d="M 152,2 C 146,12 136,15 125,14" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
