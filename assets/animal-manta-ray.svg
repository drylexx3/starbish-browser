<!-- Concept D: The Celestial Manta Ray (Oceanic Guardian: Wings form a star-shield, White & Deep Navy) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <defs>
    <linearGradient id="mantaNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Navy Circular Boundary Ring from Concept 21 -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Manta Ray Wings (Outer Silhouette in Deep Navy) -->
    <path d="M 0,-130
             C 45,-120 120,-80 165,-20
             C 175,-5 160,25 125,45
             C 75,70 35,90 15,140
             L 0,165
             L -15,140
             C -35,90 -75,70 -125,45
             C -160,25 -175,-5 -165,-20
             C -120,-80 -45,-120 0,-130 Z"
          fill="url(#mantaNavy)" stroke="#1E40AF" stroke-width="4"/>

    <!-- Pure White Central Underbelly / Star Marking -->
    <path d="M 0,-115
             C 25,-100 65,-60 85,-15
             C 65,25 35,55 0,75
             C -35,55 -65,25 -85,-15
             C -65,-60 -25,-100 0,-115 Z"
          fill="#FFFFFF"/>

    <!-- Head Cephalic Horns (Cute & Iconic Manta silhouette) -->
    <path d="M -30,-115 C -40,-135 -15,-145 -5,-125 Z" fill="#FFFFFF"/>
    <path d="M 30,-115 C 40,-135 15,-145 5,-125 Z" fill="#FFFFFF"/>

    <!-- Central Diamond Star on the Manta Back -->
    <polygon points="0,-60 18,-15 0,30 -18,-15" fill="#172554"/>
    <circle cx="0" cy="-15" r="5" fill="#FFFFFF"/>

    <!-- Expressive Eyes on Outer Head -->
    <circle cx="-50" cy="-90" r="5" fill="#FFFFFF"/>
    <circle cx="-50" cy="-90" r="2.5" fill="#080A10"/>
    <circle cx="50" cy="-90" r="5" fill="#FFFFFF"/>
    <circle cx="50" cy="-90" r="2.5" fill="#080A10"/>
  </g>
</svg>
