<!-- Concept A: Brave/Vivaldi style - Ultra-clean geometric faceted star with solid bold flat vectors -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="56" fill="#0d1117"/>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#3a6073"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="starBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
  </defs>

  <!-- Clean Shield Silhouette -->
  <path d="M 128 36 C 172 36, 204 48, 212 60 C 212 144, 176 196, 128 224 C 80 196, 44 144, 44 60 C 52 48, 84 36, 128 36 Z" 
        fill="url(#shieldFill)" stroke="#374151" stroke-width="4"/>

  <!-- Geometric Star Cutout / Emblem (Iconic flat design) -->
  <polygon points="128,68 143,108 186,108 151,134 164,174 128,149 92,174 105,134 70,108 113,108" 
           fill="url(#starBrand)"/>
  
  <!-- Subtle facet line for brand depth -->
  <polygon points="128,68 143,108 128,149 105,134 70,108 113,108" fill="#ffffff" opacity="0.15"/>
</svg>
