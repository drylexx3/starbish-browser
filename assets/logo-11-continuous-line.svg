<!-- 11. Minimalist Continuous Line / Apple Style: Pure single-stroke flowing loop star -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Light background like Apple / Figma icon -->
  <rect width="256" height="256" rx="56" fill="#F1F5F9"/>

  <g transform="translate(128, 128)">
    <!-- Continuous loop woven star in deep midnight navy & coral -->
    <path d="M 0,-84 
             C 12,-48 36,-32 76,-26
             C 42,2 32,24 48,64
             C 16,42 -16,42 -48,64
             C -32,24 -42,2 -76,-26
             C -36,-32 -12,-48 0,-84 Z" 
          fill="#0F172A" stroke="#0F172A" stroke-width="12" stroke-linejoin="round"/>

    <!-- Inner woven cutout in electric coral -->
    <polygon points="0,-36 28,-10 18,26 -18,26 -28,-10" fill="#FF5722"/>
    <circle cx="0" cy="0" r="6" fill="#F1F5F9"/>
  </g>
</svg>
