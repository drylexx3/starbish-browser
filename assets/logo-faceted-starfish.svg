<!-- Concept C: Bold Brave-style geometric faceted starfish / star emblem (Flat, iconic, sharp vector) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Squircle App Background -->
  <rect width="256" height="256" rx="58" fill="#18181b"/>

  <g transform="translate(128, 128)">
    <!-- Main Star Arms (Faceted Flat Geometry like Brave's Lion) -->
    <!-- Top arm -->
    <polygon points="0,-85 24,-24 0,-10" fill="#fb923c"/>
    <polygon points="0,-85 -24,-24 0,-10" fill="#f97316"/>

    <!-- Right arm -->
    <polygon points="82,-26 24,-24 10,0" fill="#f97316"/>
    <polygon points="82,-26 38,28 10,0" fill="#ea580c"/>

    <!-- Bottom Right arm -->
    <polygon points="52,75 38,28 0,14" fill="#ea580c"/>
    <polygon points="52,75 0,40 0,14" fill="#c2410c"/>

    <!-- Bottom Left arm -->
    <polygon points="-52,75 0,40 0,14" fill="#c2410c"/>
    <polygon points="-52,75 -38,28 0,14" fill="#ea580c"/>

    <!-- Left arm -->
    <polygon points="-82,-26 -38,28 -10,0" fill="#ea580c"/>
    <polygon points="-82,-26 -24,-24 -10,0" fill="#f97316"/>

    <!-- Center Diamond Core (Privacy Shield Focus) -->
    <polygon points="0,-24 24,0 0,24 -24,0" fill="#ffedd5"/>
    <circle cx="0" cy="0" r="5" fill="#c2410c"/>
  </g>
</svg>
