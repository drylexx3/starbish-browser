<!-- 7. Precision Line-Art / Blueprint: Linear & Raycast style developer tool aesthetic -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="54" fill="#090D16"/>
  <!-- Concentric precision grid rings -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#1E293B" stroke-width="2"/>
  <circle cx="128" cy="128" r="56" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- Axis crosshairs -->
  <line x1="128" y1="24" x2="128" y2="232" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="24" y1="128" x2="232" y2="128" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Crisp 8-point compass navigation star in electric cyan precision wireframe -->
  <g stroke="#38BDF8" stroke-width="3.5" fill="none" stroke-linejoin="round">
    <!-- Star profile -->
    <polygon points="128,48 140,116 208,128 140,140 128,208 116,140 48,128 116,116"/>
    <!-- Diagonal sub-points -->
    <polygon points="128,84 146,110 172,128 146,146 128,172 110,146 84,128 110,110" stroke="#F43F5E" stroke-width="2"/>
  </g>
  <!-- Center focal point -->
  <circle cx="128" cy="128" r="5" fill="#38BDF8"/>
</svg>
