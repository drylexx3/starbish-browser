<!-- Concept A: The Star Orca (Firefox composition: Sleek Orca curving dynamically around a celestial star orb) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle Canvas (Matching Concept 21 background) -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <defs>
    <linearGradient id="orcaNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Navy Outer Circle Ring from Concept 21 -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Central Glowing Star Diamond (The Core being protected) -->
    <polygon points="0,-48 14,-14 48,0 14,14 0,48 -14,14 -48,0 -14,-14" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="6" fill="#172554"/>

    <!-- Dynamic Orca Swirling Around the Star (Firefox Swirl Dynamic) -->
    <!-- Orca Body (Deep Midnight Navy) -->
    <path d="M 0,-140
             C 80,-140 145,-75 145,15
             C 145,95 85,145 0,145
             C -65,145 -125,105 -135,45
             C -140,15 -125,-25 -105,-45
             C -85,-65 -45,-75 -25,-55
             C -15,-45 -10,-25 -25,-10
             C -45,10 -55,35 -40,65
             C -20,105 45,105 85,75
             C 115,50 115,-20 85,-65
             C 65,-95 30,-120 0,-140 Z"
          fill="url(#orcaNavy)" stroke="#1E40AF" stroke-width="4"/>

    <!-- Orca Dorsal Fin -->
    <path d="M 120,-35 C 150,-50 165,-25 138,5 Z" fill="#1E3A8A"/>

    <!-- Orca Tail Flukes -->
    <path d="M 0,-140 C -15,-165 -35,-175 -50,-165 C -35,-150 -15,-145 0,-140 Z" fill="#1E3A8A"/>
    <path d="M 0,-140 C 15,-165 35,-175 50,-165 C 35,-150 15,-145 0,-140 Z" fill="#1E40AF"/>

    <!-- Orca Iconic Pure White Belly & Eye Patch Marking -->
    <!-- Eye Patch (Pure White) -->
    <ellipse cx="-85" cy="5" rx="16" ry="10" transform="rotate(-30 -85 5)" fill="#FFFFFF"/>
    <circle cx="-95" cy="22" r="4.5" fill="#FFFFFF"/>

    <!-- Belly Swirl Marking (Pure White) -->
    <path d="M -95,45 
             C -110,75 -70,120 -5,120
             C 45,120 85,90 95,50
             C 80,75 40,95 -5,95
             C -45,95 -75,70 -95,45 Z" fill="#FFFFFF"/>
  </g>
</svg>
