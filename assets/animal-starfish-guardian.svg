<!-- Concept C: The Living Starfish Guardian (Organic marine animal with charismatic face & sleek geometry) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle Canvas -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <defs>
    <linearGradient id="starfishNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Navy Circular Boundary Ring from Concept 21 -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Dynamic Curved Living Starfish Body (Sleek organic marine silhouette) -->
    <!-- Shadow Navy Layer -->
    <path d="M 0,-155
             C 18,-85 45,-60 90,-45
             C 145,-30 165,-10 150,15
             C 105,35 85,60 85,115
             C 85,155 60,165 35,145
             C 0,115 -25,115 -60,145
             C -85,165 -110,150 -105,115
             C -100,60 -125,35 -165,15
             C -180,-10 -160,-30 -110,-45
             C -60,-60 -30,-85 0,-155 Z"
          fill="url(#starfishNavy)" stroke="#1E40AF" stroke-width="4"/>

    <!-- Upper Arm & Face Facet (Pure Titanium White) -->
    <path d="M 0,-155
             C 15,-85 35,-60 70,-45
             L 0,0 
             L -70,-45
             C -35,-60 -15,-85 0,-155 Z"
          fill="#FFFFFF"/>

    <!-- Right Arm White Accent -->
    <path d="M 0,0 L 70,-45 C 120,-30 150,-10 150,15 C 115,25 75,25 0,0 Z" fill="#F8FAFC"/>
    <!-- Bottom Right Arm Navy Accent -->
    <path d="M 0,0 L 75,25 C 85,60 85,115 65,145 C 45,115 25,65 0,0 Z" fill="#1E3A8A"/>
    <!-- Bottom Left Arm White Accent -->
    <path d="M 0,0 L -25,65 C -45,115 -75,145 -95,115 C -85,75 -65,35 0,0 Z" fill="#FFFFFF"/>
    <!-- Left Arm Navy Accent -->
    <path d="M 0,0 L -65,35 C -115,35 -155,10 -150,-15 C -115,-30 -70,-45 0,0 Z" fill="#172554"/>

    <!-- Animal Face Details (Charismatic, confident, like Brave & Firefox) -->
    <!-- Sleek Confident Eyes -->
    <ellipse cx="-22" cy="-28" rx="8" ry="12" transform="rotate(-15 -22 -28)" fill="#080A10"/>
    <ellipse cx="22" cy="-28" rx="8" ry="12" transform="rotate(15 22 -28)" fill="#080A10"/>
    <!-- Eye Catchlights (White sparkle) -->
    <circle cx="-20" cy="-32" r="3.5" fill="#FFFFFF"/>
    <circle cx="24" cy="-32" r="3.5" fill="#FFFFFF"/>

    <!-- Forehead Star Mark -->
    <polygon points="0,-75 6,-60 20,-60 9,-50 13,-36 0,-44 -13,-36 -9,-50 -20,-60 -6,-60" fill="#1E3A8A"/>
  </g>
</svg>
