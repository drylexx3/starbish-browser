<!-- 1. Monogram 'S' Star: Arc/Vivaldi style, high-end modern tech branding -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="52" fill="#0A0A0C"/>
  <defs>
    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF9933"/>
    </linearGradient>
  </defs>
  <!-- Stylized sweeping 'S' interlocking with an embedded star core -->
  <path d="M 168 64
           C 112 64, 76 88, 76 120
           C 76 172, 180 140, 180 184
           C 180 204, 154 216, 128 216
           C 96 216, 76 196, 74 180"
        fill="none" stroke="url(#monogramGrad)" stroke-width="26" stroke-linecap="round"/>
  <!-- Diamond star spark in the focal center -->
  <polygon points="128,96 138,128 170,128 144,146 154,178 128,158 102,178 112,146 86,128 118,128" 
           fill="#FFFFFF"/>
</svg>
