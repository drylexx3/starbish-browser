<!-- Concept B: The Arctic Star Fox (Brave-style noble faceted animal head, Firefox charisma, White & Navy) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Obsidian Canvas -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <g transform="translate(256, 256)">
    <!-- Navy Circular Boundary Ring from Concept 21 -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="162" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Geometric Faceted Star Fox / Wolf Head -->
    
    <!-- Ears (Outer & Inner) -->
    <!-- Left Ear Outer (Navy) -->
    <polygon points="-75,-40 -120,-140 -40,-95" fill="#172554"/>
    <polygon points="-65,-50 -105,-125 -45,-90" fill="#FFFFFF"/>
    <!-- Right Ear Outer (White) -->
    <polygon points="75,-40 120,-140 40,-95" fill="#FFFFFF"/>
    <polygon points="65,-50 105,-125 45,-90" fill="#1E3A8A"/>

    <!-- Forehead Star Diamond (Starbish Identity) -->
    <polygon points="0,-115 18,-85 0,-55 -18,-85" fill="#FFFFFF"/>
    <polygon points="0,-115 18,-85 0,-85" fill="#F8FAFC"/>
    <polygon points="0,-115 -18,-85 0,-85" fill="#1E3A8A"/>

    <!-- Crown & Brow Facets -->
    <polygon points="0,-55 45,-90 60,-40 0,-25" fill="#F8FAFC"/>
    <polygon points="0,-55 -45,-90 -60,-40 0,-25" fill="#172554"/>

    <!-- Cheeks (Wide angular fur facets like Brave lion) -->
    <!-- Left Cheek Outer (Navy) -->
    <polygon points="-60,-40 -125,-10 -75,40 -40,15" fill="#1E3A8A"/>
    <!-- Left Cheek Lower -->
    <polygon points="-75,40 -110,65 -45,75 -25,50" fill="#172554"/>
    <!-- Right Cheek Outer (Pure White) -->
    <polygon points="60,-40 125,-10 75,40 40,15" fill="#FFFFFF"/>
    <!-- Right Cheek Lower -->
    <polygon points="75,40 110,65 45,75 25,50" fill="#F1F5F9"/>

    <!-- Eyes (Sleek, intelligent, alert) -->
    <!-- Left Eye (Glowing Star Diamond Pupil) -->
    <polygon points="-48,-15 -25,-8 -40,-2 -55,-10" fill="#FFFFFF"/>
    <polygon points="-42,-12 -34,-8 -40,-6 -45,-10" fill="#080A10"/>
    <!-- Right Eye -->
    <polygon points="48,-15 25,-8 40,-2 55,-10" fill="#172554"/>
    <polygon points="42,-12 34,-8 40,-6 45,-10" fill="#FFFFFF"/>

    <!-- Snout & Bridge of Nose -->
    <polygon points="0,-25 25,-10 18,50 0,65" fill="#FFFFFF"/>
    <polygon points="0,-25 -25,-10 -18,50 0,65" fill="#1E3A8A"/>

    <!-- Nose Tip in Deep Navy/Black -->
    <polygon points="0,55 14,65 0,78 -14,65" fill="#080A10"/>

    <!-- Chin Facet -->
    <polygon points="0,78 20,85 0,115 -20,85" fill="#FFFFFF"/>
    <polygon points="0,78 -20,85 0,115" fill="#172554"/>
  </g>
</svg>
