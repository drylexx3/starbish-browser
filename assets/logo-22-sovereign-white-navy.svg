<!-- 22. The Sovereign Monogram: Thick crisp white geometry with deep layered navy planes -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Obsidian Canvas -->
  <rect width="512" height="512" rx="114" fill="#0A0D14"/>

  <g transform="translate(256, 256)">
    <!-- Deep Navy Geometric Base Plate (4-point star rounded) -->
    <path d="M 0,-170 
             C 40,-80 80,-40 170,0 
             C 80,40 40,80 0,170 
             C -40,80 -80,40 -170,0 
             C -80,-40 -40,-80 0,-170 Z" 
          fill="#172554" stroke="#1E3A8A" stroke-width="6"/>

    <!-- Sharp Crisp White Star Inside (Negative cutout look) -->
    <polygon points="0,-130 38,-38 130,0 38,38 0,130 -38,38 -130,0 -38,-38" fill="#FFFFFF"/>

    <!-- Navy Center Facet Lines -->
    <line x1="0" y1="-130" x2="0" y2="130" stroke="#0F172A" stroke-width="4"/>
    <line x1="-130" y1="0" x2="130" y2="0" stroke="#0F172A" stroke-width="4"/>

    <!-- Center Sapphire Aperture Core -->
    <circle cx="0" cy="0" r="28" fill="#1E3A8A" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
  </g>
</svg>
