<!-- 17. The Nova Aperture: Linear / OpenAI style, ultra-sophisticated geometric precision -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Dark Canvas -->
  <rect width="512" height="512" rx="112" fill="#090A0F"/>

  <!-- Precision Geometric Star Aperture (5 curved interlocking sails) -->
  <g transform="translate(256, 256)">
    <!-- Defs for subtle, high-end metallic lighting -->
    <defs>
      <linearGradient id="blade1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
      <linearGradient id="blade2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#60A5FA"/>
        <stop offset="100%" stop-color="#2563EB"/>
      </linearGradient>
    </defs>

    <!-- 4-Pointed High-Tech Navigation Star / Aperture -->
    <!-- Blade North -->
    <path d="M 0,-170 C 0,-70 50,-20 120,0 C 50,0 20,-50 0,-170 Z" fill="url(#blade1)"/>
    <!-- Blade East -->
    <path d="M 170,0 C 70,0 20,50 0,120 C 0,50 50,20 170,0 Z" fill="url(#blade2)"/>
    <!-- Blade South -->
    <path d="M 0,170 C 0,70 -50,20 -120,0 C -50,0 -20,50 0,170 Z" fill="url(#blade1)"/>
    <!-- Blade West -->
    <path d="M -170,0 C -70,0 -20,-50 0,-120 C 0,-50 -50,-20 -170,0 Z" fill="url(#blade2)"/>

    <!-- Pristine Center Spark -->
    <circle cx="0" cy="0" r="16" fill="#090A0F"/>
    <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
  </g>
</svg>
