<!-- 6. Pixel Art 16-Bit Retro: True pixel-grid indie game & hacker aesthetic -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="52" fill="#181825"/>
  <g fill="#F38BA8" transform="translate(48, 48)">
    <!-- 16x16 Pixel Art Starfish (10px per pixel) -->
    <!-- Top arm -->
    <rect x="70" y="0" width="20" height="30" fill="#F38BA8"/>
    <rect x="60" y="30" width="40" height="20" fill="#F38BA8"/>
    <!-- Left & Right Upper arms -->
    <rect x="0" y="60" width="40" height="20" fill="#F38BA8"/>
    <rect x="120" y="60" width="40" height="20" fill="#F38BA8"/>
    <rect x="20" y="50" width="120" height="40" fill="#F38BA8"/>
    <!-- Center Core -->
    <rect x="40" y="40" width="80" height="60" fill="#F38BA8"/>
    <rect x="60" y="60" width="40" height="20" fill="#FFFFFF"/>
    <!-- Bottom Arms -->
    <rect x="30" y="90" width="40" height="40" fill="#F38BA8"/>
    <rect x="90" y="90" width="40" height="40" fill="#F38BA8"/>
    <rect x="20" y="130" width="30" height="30" fill="#F38BA8"/>
    <rect x="110" y="130" width="30" height="30" fill="#F38BA8"/>
    <!-- Center Black pupil / core -->
    <rect x="70" y="60" width="20" height="20" fill="#11111B"/>
  </g>
</svg>
