<!-- 18. Arc / Vivaldi Geometric S-Star: Premium browser tech brand mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Squircle canvas -->
  <rect width="512" height="512" rx="116" fill="#0F172A"/>

  <defs>
    <linearGradient id="arcIris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="arcCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Two interlocking geometric loops forming an 'S' and a star cross -->
  <g transform="translate(256, 256)">
    <!-- Upper Loop 'S' -->
    <path d="M 0,-130 
             C 80,-130 130,-80 130,-10 
             C 130,50 80,80 0,80
             C -40,80 -70,60 -70,20
             C -70,-20 -40,-40 0,-40
             C 40,-40 70,-10 70,20"
          fill="none" stroke="url(#arcIris)" stroke-width="42" stroke-linecap="round"/>

    <!-- Lower Accent Star Arc -->
    <path d="M 0,130 
             C -80,130 -130,80 -130,10 
             C -130,-50 -80,-80 0,-80"
          fill="none" stroke="url(#arcCoral)" stroke-width="42" stroke-linecap="round"/>

    <!-- Central Diamond Core Spark -->
    <polygon points="0,-24 16,0 0,24 -16,0" fill="#FFFFFF"/>
  </g>
</svg>
