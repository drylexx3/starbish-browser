<!-- 24. The Minimalist Starfish: Pure white organic geometric silhouette with navy facets -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Matte Dark Navy-Black Background -->
  <rect width="512" height="512" rx="114" fill="#05070B"/>

  <g transform="translate(256, 256)">
    <!-- Base Deep Midnight Navy Aura -->
    <circle cx="0" cy="0" r="170" fill="#0B132B" opacity="0.6"/>

    <!-- Left Facet Halves (Deep Royal Navy #1D4ED8 & #1E3A8A) -->
    <!-- Top Arm Left -->
    <path d="M 0,-160 C -10,-80 -40,-40 0,0 Z" fill="#1E3A8A"/>
    <!-- Right Arm Left -->
    <path d="M 152,-50 C 76,-10 38,10 0,0 Z" fill="#172554"/>
    <!-- Bottom Right Arm Left -->
    <path d="M 94,130 C 47,65 15,30 0,0 Z" fill="#1E3A8A"/>
    <!-- Bottom Left Arm Left -->
    <path d="M -94,130 C -70,65 -30,30 0,0 Z" fill="#172554"/>
    <!-- Left Arm Left -->
    <path d="M -152,-50 C -110,-40 -50,-10 0,0 Z" fill="#1E3A8A"/>

    <!-- Right Facet Halves (Pure Titanium White #FFFFFF & Crisp #F1F5F9) -->
    <!-- Top Arm Right -->
    <path d="M 0,-160 C 10,-80 40,-40 0,0 Z" fill="#FFFFFF"/>
    <!-- Right Arm Right -->
    <path d="M 152,-50 C 110,-40 50,-10 0,0 Z" fill="#F8FAFC"/>
    <!-- Bottom Right Arm Right -->
    <path d="M 94,130 C 70,65 30,30 0,0 Z" fill="#FFFFFF"/>
    <!-- Bottom Left Arm Right -->
    <path d="M -94,130 C -47,65 -15,30 0,0 Z" fill="#F8FAFC"/>
    <!-- Left Arm Right -->
    <path d="M -152,-50 C -76,-10 -38,10 0,0 Z" fill="#FFFFFF"/>

    <!-- Center Navigation Core Dot in Pure White -->
    <circle cx="0" cy="0" r="14" fill="#172554" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>
</svg>
