<!-- Orca Refinement 2: The Faceted Geometric Orca (Brave-level precision facet styling, White & Navy) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Obsidian Background -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <g transform="translate(256, 256)">
    <!-- Navy Circular Boundary Ring -->
    <circle cx="0" cy="0" r="184" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="166" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Dynamic Leaping Geometric Orca (Profile Leaping with Cresting Star) -->
    
    <!-- Tail Fluke Left -->
    <polygon points="-110,135 -165,155 -145,120 -115,115" fill="#172554"/>
    <!-- Tail Fluke Right -->
    <polygon points="-110,135 -145,120 -140,85 -105,100" fill="#1E3A8A"/>

    <!-- Lower Body / Peduncle Facets -->
    <polygon points="-105,100 -110,135 -75,90 -65,60" fill="#172554"/>
    <polygon points="-105,100 -65,60 -85,30 -115,50" fill="#0F172A"/>

    <!-- Dorsal Fin (Faceted & Proud) -->
    <polygon points="-10,-110 15,-180 35,-140 10,-100" fill="#172554"/>
    <polygon points="-10,-110 15,-180 -5,-140" fill="#1E3A8A"/>

    <!-- Upper Body / Back Facets (Deep Navy & Midnight) -->
    <polygon points="-85,30 -65,60 0,20 -10,-40" fill="#172554"/>
    <polygon points="-85,30 -10,-40 -10,-110 -60,-65" fill="#1E3A8A"/>
    <polygon points="-10,-110 35,-140 60,-90 10,-100" fill="#1E40AF"/>
    <polygon points="-10,-40 0,20 70,-10 60,-90" fill="#172554"/>

    <!-- Head & Snout (Strong, aerodynamic, noble) -->
    <polygon points="60,-90 70,-10 145,-15 130,-75" fill="#1E3A8A"/>
    <polygon points="130,-75 145,-15 160,-10 150,-55" fill="#172554"/>

    <!-- Pure White Markings (The signature Orca identity) -->
    <!-- Iconic Oval Eye Patch in Pure White -->
    <polygon points="90,-75 125,-65 115,-45 80,-55" fill="#FFFFFF"/>
    <!-- Eye inside patch -->
    <circle cx="118" cy="-35" r="4" fill="#080A10"/>
    <circle cx="119" cy="-36" r="1.5" fill="#FFFFFF"/>

    <!-- Pure White Chin and Underbelly -->
    <polygon points="70,-10 145,-15 140,25 65,35" fill="#FFFFFF"/>
    <polygon points="65,35 140,25 105,65 40,60" fill="#F8FAFC"/>
    <polygon points="40,60 105,65 55,95 10,75" fill="#FFFFFF"/>
    <polygon points="10,75 55,95 -10,105 -25,75" fill="#F1F5F9"/>

    <!-- Pectoral Fin (White & Navy) -->
    <polygon points="65,20 115,45 85,85 45,45" fill="#1E40AF"/>
    <polygon points="65,20 85,85 50,70" fill="#172554"/>

    <!-- Star Navigation Sparkle in Top Left (Focus point) -->
    <polygon points="-50,-10 0,-10 10,10 -15,15" fill="#0F172A" opacity="0.3"/>
    <polygon points="-8,-8 0,-35 8,-8 35,0 8,8 0,35 -8,8 -35,0" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="4" fill="#172554"/>
  </g>
</svg>
