<!-- 15. Heraldic Naval Crest: Classical royal maritime emblem, navy & gold linework -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="54" fill="#0B132B"/>
  <g transform="translate(128, 128)">
    <!-- Laurel Wreath Circle -->
    <circle cx="0" cy="0" r="88" fill="none" stroke="#E0A96D" stroke-width="3" stroke-dasharray="10 4"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#E0A96D" stroke-width="1.5"/>

    <!-- Classic 5-arm star crest with fine interior line art -->
    <polygon points="0,-64 16,-18 62,-18 26,10 40,54 0,26 -40,54 -26,10 -62,-18 -16,-18" 
             fill="#1C2541" stroke="#E0A96D" stroke-width="3" stroke-linejoin="round"/>

    <!-- Central Anchor / Compass Cross -->
    <line x1="0" y1="-44" x2="0" y2="38" stroke="#E0A96D" stroke-width="2"/>
    <line x1="-30" y1="-6" x2="30" y2="-6" stroke="#E0A96D" stroke-width="2"/>
    <circle cx="0" cy="-6" r="6" fill="#E0A96D"/>
    <!-- Small star points around -->
    <circle cx="0" cy="-76" r="3" fill="#E0A96D"/>
    <circle cx="76" cy="0" r="3" fill="#E0A96D"/>
    <circle cx="0" cy="76" r="3" fill="#E0A96D"/>
    <circle cx="-76" cy="0" r="3" fill="#E0A96D"/>
  </g>
</svg>
