<!-- 8. Dynamic Stellar Vortex: Opera & Edge inspired fluid rotational browser mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="56" fill="#111827"/>
  <defs>
    <linearGradient id="vortex1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#DD2476"/>
    </linearGradient>
    <linearGradient id="vortex2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
  </defs>

  <g transform="translate(128, 128)">
    <!-- Swirling vortex petals forming a pinwheel star -->
    <path d="M 0,-85 C 40,-85 85,-40 85,0 C 50,0 20,-20 0,0 Z" fill="url(#vortex1)"/>
    <path d="M 85,0 C 85,40 40,85 0,85 C 0,50 20,20 0,0 Z" fill="#FB923C"/>
    <path d="M 0,85 C -40,85 -85,40 -85,0 C -50,0 -20,20 0,0 Z" fill="url(#vortex2)"/>
    <path d="M -85,0 C -85,-40 -40,-85 0,-85 C 0,-50 -20,-20 0,0 Z" fill="#3B82F6"/>

    <!-- Center white core spark -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    <polygon points="0,-18 5,-5 18,0 5,5 0,18 -5,5 -18,0 -5,-5" fill="#111827"/>
  </g>
</svg>
