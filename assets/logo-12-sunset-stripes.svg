<!-- 12. 80s Sunset Stripes: Retro California / Vintage Pacific beach & surf silhouette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <rect width="256" height="256" rx="54" fill="#18181B"/>

  <!-- Clip mask of the Starfish silhouette -->
  <defs>
    <clipPath id="starfishClip">
      <path d="M 128 36
               C 136 72, 148 92, 186 100
               C 220 106, 226 122, 210 140
               C 180 152, 172 172, 170 204
               C 152 218, 136 210, 128 184
               C 120 210, 104 218, 86 204
               C 84 172, 76 152, 46 140
               C 30 122, 36 106, 70 100
               C 108 92, 120 72, 128 36 Z"/>
    </clipPath>
  </defs>

  <!-- Horizontal Sunset Bars through the Starfish -->
  <g clip-path="url(#starfishClip)">
    <rect x="0" y="30" width="256" height="24" fill="#FDE047"/>
    <rect x="0" y="58" width="256" height="24" fill="#FBBF24"/>
    <rect x="0" y="86" width="256" height="24" fill="#F97316"/>
    <rect x="0" y="114" width="256" height="24" fill="#EA580C"/>
    <rect x="0" y="142" width="256" height="24" fill="#E11D48"/>
    <rect x="0" y="170" width="256" height="24" fill="#BE123C"/>
    <rect x="0" y="198" width="256" height="30" fill="#881337"/>
  </g>

  <!-- Clean dark backdrop circle border -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="#27272A" stroke-width="4"/>
</svg>
