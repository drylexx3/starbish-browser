<!-- Concept S1: Symmetrical Orca Guardian Crest (Brave Lion architecture applied to Orca) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Dark Obsidian Background -->
  <rect width="512" height="512" rx="116" fill="#080A10"/>

  <defs>
    <linearGradient id="shieldNavyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Navy Circular Boundary Ring (Concept 21 frame) -->
    <circle cx="0" cy="0" r="184" fill="none" stroke="#172554" stroke-width="5"/>
    <circle cx="0" cy="0" r="166" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="6 12" opacity="0.6"/>

    <!-- Dorsal Fin Crest (Towering central fin behind head) -->
    <path d="M -24,-80 C -12,-160 0,-175 0,-175 C 0,-175 12,-160 24,-80 Z" fill="#172554" stroke="#1E40AF" stroke-width="3"/>
    <path d="M 0,-175 C 0,-175 12,-160 24,-80 L 0,-80 Z" fill="#1E3A8A"/>

    <!-- Pectoral Fins (Flanking wings like a protective shield) -->
    <!-- Left Fin -->
    <path d="M -80,10 C -130,20 -165,50 -155,90 C -135,95 -100,75 -70,45 Z" fill="#172554" stroke="#1E40AF" stroke-width="3"/>
    <path d="M -70,45 C -100,75 -135,95 -155,90 C -150,80 -130,55 -90,30 Z" fill="#1E3A8A"/>
    <!-- Right Fin -->
    <path d="M 80,10 C 130,20 165,50 155,90 C 135,95 100,75 70,45 Z" fill="#172554" stroke="#1E40AF" stroke-width="3"/>
    <path d="M 70,45 C 100,75 135,95 155,90 C 150,80 130,55 90,30 Z" fill="#FFFFFF" opacity="0.95"/>

    <!-- Main Symmetrical Orca Head Silhouette (Midnight Navy) -->
    <path d="M 0,-115
             C 65,-115 100,-70 100,-15
             C 100,50 65,110 0,135
             C -65,110 -100,50 -100,-15
             C -100,-70 -65,-115 0,-115 Z"
          fill="url(#shieldNavyBase)" stroke="#1E40AF" stroke-width="4"/>

    <!-- White Symmetrical Jaw & Throat Shield (Pure White) -->
    <path d="M 0,135
             C 45,110 70,65 60,15
             C 45,35 25,45 0,45
             C -25,45 -45,35 -60,15
             C -70,65 -45,110 0,135 Z"
          fill="#FFFFFF"/>

    <!-- Pure White Symmetrical Iconic Eye Patches (The Orca Signatures) -->
    <!-- Left Eye Patch -->
    <ellipse cx="-64" cy="-25" rx="22" ry="12" transform="rotate(35 -64 -25)" fill="#FFFFFF"/>
    <!-- Right Eye Patch -->
    <ellipse cx="64" cy="-25" rx="22" ry="12" transform="rotate(-35 64 -25)" fill="#FFFFFF"/>

    <!-- Calm, Confident Eyes inside/near patches -->
    <circle cx="-50" cy="-10" r="5" fill="#FFFFFF"/>
    <circle cx="-50" cy="-10" r="2.5" fill="#080A10"/>
    <circle cx="50" cy="-10" r="5" fill="#FFFFFF"/>
    <circle cx="50" cy="-10" r="2.5" fill="#080A10"/>

    <!-- Central Navigation Star (Starbish Core Diamond on the forehead) -->
    <polygon points="0,-75 14,-50 0,-25 -14,-50" fill="#FFFFFF"/>
    <polygon points="0,-75 14,-50 0,-50" fill="#F8FAFC"/>
    <polygon points="0,-75 -14,-50 0,-50" fill="#1E3A8A"/>
    <circle cx="0" cy="-50" r="3.5" fill="#172554"/>
  </g>
</svg>
