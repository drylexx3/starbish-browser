<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbish Browser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="browser-chrome">
    <!-- Top Tabs Strip -->
    <div id="tabs-bar">
      <div id="brand-header">
        <img src="../../assets/icon-32.png" alt="Starbish" id="brand-logo">
        <span id="brand-name">Starbish</span>
      </div>

      <div id="tabs-container">
        <!-- Tabs rendered dynamically -->
      </div>

      <button id="btn-new-tab" title="Nueva pestaña (Ctrl+T)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
    </div>

    <!-- Navigation & Address Bar -->
    <div id="nav-bar">
      <div id="nav-controls">
        <button id="btn-back" class="nav-btn" title="Atrás" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Adelante" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
        <button id="btn-reload" class="nav-btn" title="Recargar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 4v6h-6"></path>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>

      <!-- Omnibox (Address & Bing Search bar) -->
      <div id="omnibox-wrapper">
        <div id="security-badge" title="Conexión Segura & Escudo Starbish">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <input type="text" id="omnibox" placeholder="Busca con Bing o escribe una URL..." autocomplete="off" spellcheck="false">
        <div id="search-badge" title="Motor de búsqueda por defecto: Bing">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span>Bing</span>
        </div>
      </div>

      <!-- Starbish Shield & Tools -->
      <div id="chrome-actions">
        <!-- Shield Dropdown Toggle -->
        <button id="btn-shield" class="action-btn" title="Escudo Starbish (Bloqueador de anuncios)">
          <div class="shield-icon-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#0f172a" stroke="#38bdf8" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            <span id="shield-badge">0</span>
          </div>
        </button>

        <!-- New Identity (Amnesic reset) -->
        <button id="btn-identity" class="action-btn" title="Nueva Identidad (Limpieza amnésica estilo Mullvad)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
            <path d="M8 16H3v5"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Shield Popup Modal -->
    <div id="shield-popup" class="hidden">
      <div class="popup-header">
        <img src="../../assets/icon-32.png" width="22" height="22" alt="Orca">
        <div class="popup-title-group">
          <h4>Escudo Starbish</h4>
          <span class="status-pill">Protección Activa</span>
        </div>
      </div>
      <div class="popup-body">
        <div class="stat-card">
          <span class="stat-number" id="popup-blocked-count">0</span>
          <span class="stat-label">Anuncios y rastreadores bloqueados</span>
        </div>
        <div class="feature-list">
          <div class="feature-item">
            <span class="feature-check">✓</span>
            <span>Bloqueador de anuncios de YouTube</span>
          </div>
          <div class="feature-item">
            <span class="feature-check">✓</span>
            <span>DNS Cifrado Mullvad (DoH)</span>
          </div>
          <div class="feature-item">
            <span class="feature-check">✓</span>
            <span>Protección de fuga WebRTC</span>
          </div>
          <div class="feature-item">
            <span class="feature-check">✓</span>
            <span>Modo Amnésico sin telemetría</span>
          </div>
        </div>
        <button id="popup-btn-clean" class="btn-clean">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path>
          </svg>
          Reiniciar Identidad Ahora
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
